name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stock_screener/web_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: stock_screener/web_frontend
        run: npm ci

      - name: Build frontend
        working-directory: stock_screener/web_frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate backend Python syntax
        run: python -m compileall -q stock_screener

  deploy:
    name: Deploy and restart services
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload application files
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIBABA_DEPLOY }}
          ARGS: '-rltgoDzvO --delete'
          SOURCE: './stock_screener'
          REMOTE_HOST: ${{ secrets.ALIYUN_SERVER_HOST }}
          REMOTE_USER: ${{ secrets.ALIBABA_USER }}
          TARGET: '/root/workspace/personal'
          # .env and runtime data belong to the server and must survive rsync --delete.
          EXCLUDE: '.env,.venv,.runtime_home,logs,__pycache__,*.pyc,web_frontend/node_modules,web_frontend/dist,web_frontend/.npm-cache'
          SCRIPT_BEFORE_REQUIRED: 'true'
          SCRIPT_BEFORE: |
            set -eu
            cd /root/workspace/personal
            mkdir -p stock_screener
            cd stock_screener
            test -f .env || { echo 'Missing server-side .env'; exit 1; }
          SCRIPT_AFTER: |
            set -eu
            cd /root/workspace/personal
            cd stock_screener

            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose -f deploy/docker-compose.yml "$@"; }
              COMPOSE_NAME='docker compose'
            elif podman compose version >/dev/null 2>&1; then
              compose() { podman compose -f deploy/podman-compose.yml "$@"; }
              COMPOSE_NAME='podman compose'
            elif command -v podman-compose >/dev/null 2>&1; then
              compose() { podman-compose -f deploy/podman-compose.yml "$@"; }
              COMPOSE_NAME='podman-compose'
            else
              echo 'Neither Docker Compose nor Podman Compose is available'
              exit 1
            fi

            echo "Using $COMPOSE_NAME"
            compose config -q
            compose up -d --build --remove-orphans
            compose ps

            curl --fail --silent --show-error \
              --retry 10 --retry-delay 3 --retry-connrefused \
              http://127.0.0.1/healthz
            curl --fail --silent --show-error \
              --retry 10 --retry-delay 3 --retry-connrefused \
              http://127.0.0.1/ | grep -q 'id="root"'
          SCRIPT_AFTER_REQUIRED: 'true'
