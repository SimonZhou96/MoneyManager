<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票池多选测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px;
            background: #f8fafc;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1e293b;
            margin-bottom: 20px;
        }
        .checkbox-group-vertical {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin: 20px 0;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        .checkbox-label:hover {
            background: rgba(37, 99, 235, 0.05);
        }
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #2563eb;
        }
        .checkbox-label span {
            font-size: 0.95rem;
            color: #1e293b;
            user-select: none;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 20px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: 8px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result h3 {
            color: #166534;
            margin-bottom: 10px;
        }
        .result ul {
            list-style: none;
            padding: 0;
        }
        .result li {
            padding: 4px 0;
            color: #15803d;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>📊 股票池多选测试</h1>
        <p>测试多选复选框功能和样式</p>

        <div class="checkbox-group-vertical">
            <label class="checkbox-label">
                <input type="checkbox" class="stockpool-type-checkbox" value="best" checked>
                <span>最好股票</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" class="stockpool-type-checkbox" value="index">
                <span>指数成份股</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" class="stockpool-type-checkbox" value="industry">
                <span>行业龙头</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" class="stockpool-type-checkbox" value="ipo">
                <span>新股</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" class="stockpool-type-checkbox" value="etf">
                <span>ETF列表</span>
            </label>
        </div>

        <button onclick="testSelection()">测试选择</button>

        <div class="result" id="result">
            <h3>选中的股票池：</h3>
            <ul id="resultList"></ul>
        </div>
    </div>

    <script>
        function testSelection() {
            const checkboxes = document.querySelectorAll('.stockpool-type-checkbox:checked');
            const poolTypes = Array.from(checkboxes).map(cb => cb.value);

            const poolTypeLabels = {
                'best': '最好股票',
                'index': '指数成份股',
                'industry': '行业龙头',
                'ipo': '新股',
                'etf': 'ETF列表'
            };

            const resultDiv = document.getElementById('result');
            const resultList = document.getElementById('resultList');

            if (poolTypes.length === 0) {
                alert('请至少选择一个股票池类型');
                resultDiv.classList.remove('show');
                return;
            }

            resultList.innerHTML = '';
            poolTypes.forEach(type => {
                const li = document.createElement('li');
                li.textContent = `✓ ${poolTypeLabels[type]} (${type})`;
                resultList.appendChild(li);
            });

            const summary = document.createElement('li');
            summary.style.marginTop = '10px';
            summary.style.fontWeight = 'bold';
            summary.textContent = `总共选择了 ${poolTypes.length} 个股票池`;
            resultList.appendChild(summary);

            resultDiv.classList.add('show');
        }
    </script>
</body>
</html>
