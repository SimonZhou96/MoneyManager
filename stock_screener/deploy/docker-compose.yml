services:
  mysql:
    image: docker.io/library/mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-market_data}
    volumes:
      - ${MYSQL_DATA_DIR:-/data/moneymanager/mysql}:/var/lib/mysql
    networks: [moneymanager]

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${REDIS_DATA_DIR:-/data/moneymanager/redis}:/data
    networks: [moneymanager]

  web-api:
    image: moneymanager/web:latest
    build:
      context: ..
      dockerfile: deploy/Containerfile
    env_file:
      - ../.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_DIR: /data/moneymanager/artifacts
    volumes:
      - ${ARTIFACT_DIR:-/data/moneymanager/artifacts}:/data/moneymanager/artifacts
    depends_on: [mysql, redis]
    networks: [moneymanager]

  web-worker:
    image: moneymanager/web:latest
    build:
      context: ..
      dockerfile: deploy/Containerfile
    command: ["python", "-m", "web.worker"]
    env_file:
      - ../.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_DIR: /data/moneymanager/artifacts
    volumes:
      - ${ARTIFACT_DIR:-/data/moneymanager/artifacts}:/data/moneymanager/artifacts
    depends_on: [mysql, redis]
    networks: [moneymanager]

  frontend:
    image: moneymanager/frontend:latest
    build:
      context: ..
      dockerfile: deploy/Containerfile.frontend
    networks: [moneymanager]

  caddy:
    image: docker.io/library/caddy:2-alpine
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web-api, frontend]
    networks: [moneymanager]

networks:
  moneymanager:

volumes:
  caddy_data:
  caddy_config:
